name: Build Udhaya Netram Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug & Release APK
        working-directory: ./android
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output_apks
          if [ -f android/app/build/outputs/apk/debug/app-debug.debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.debug.apk output_apks/UdhayaNetram-Debug.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output_apks/UdhayaNetram-Debug.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output_apks/UdhayaNetram-Release.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UdhayaNetram-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Udhaya Netram Android App v1.0.0"
          body: |
            ## 📱 Udhaya Netram (ఉదయ నేత్రం) Android APK
            
            Download the latest Android App APK below and install on your phone.
            
            ### ✨ Features:
            - 📰 Live Telugu Daily News & E-Paper
            - 📥 1-Click PDF E-Paper Downloads
            - 🔄 Pull to Refresh Breaking News
            - 🌐 Offline Mode Support
            - ⚡ Super Fast & Lightweight (< 5 MB)
          files: output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
