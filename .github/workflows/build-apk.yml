name: Build Udhaya Netram Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Debug APK & Play Store AAB Bundle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace > ../build_log.txt 2>&1 || (cat ../build_log.txt && exit 1)

      - name: Prepare APK & AAB Output
        if: success()
        run: |
          mkdir -p output_binaries
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_binaries/ \;
          find android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} output_binaries/ \;
          echo "Generated output binaries:"
          ls -la output_binaries/

      - name: Upload APK & AAB Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UdhayaNetram-PlayStore-Binaries
          path: output_binaries/*
          retention-days: 30

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Publish GitHub Release with APK & AAB
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Udhaya Netram Android App v1.0.0"
          body: |
            ## 📱 Udhaya Netram (ఉదయ నేత్రం) Android APK & Play Store Bundle
            
            - **`app-debug.apk`**: Direct installable Android APK for phones.
            - **`app-release.aab`**: Google Play Store App Bundle for Google Play Console upload.
            
            ### ✨ Features:
            - 📰 Live Telugu Daily News & E-Paper
            - 📥 1-Click PDF E-Paper Downloads
            - 🔄 Pull to Refresh Breaking News
            - 🌐 Offline Mode Support
            - ⚡ Super Fast & Lightweight (< 5 MB)
          files: output_binaries/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
