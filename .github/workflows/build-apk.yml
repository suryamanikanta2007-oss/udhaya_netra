name: Build Udhaya Netram Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output_apks
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/ \;
          echo "Generated APK files in output_apks:"
          ls -la output_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UdhayaNetram-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Udhaya Netram Android App v1.0.0"
          body: |
            ## 📱 Udhaya Netram (ఉదయ నేత్రం) Android APK
            
            Download the latest Android App APK below and install on your phone.
            
            ### ✨ Features:
            - 📰 Live Telugu Daily News & E-Paper
            - 📥 1-Click PDF E-Paper Downloads
            - 🔄 Pull to Refresh Breaking News
            - 🌐 Offline Mode Support
            - ⚡ Super Fast & Lightweight (< 5 MB)
          files: output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
